# ----------------------------------------------------------------------
# Pretraining PHOC
# ----------------------------------------------------------------------
enable_phoc: true        # turn PHOC loss on/off
phoc_levels: [1, 2, 3, 4] # same default as HTRNet
phoc_loss_weight: 0.5     # loss scaling factor

# ----------------------------------------------------------------------
# Default HTRNet architecture
# ----------------------------------------------------------------------
architecture:
  cnn_cfg: [[2, 64], "M", [3, 128], "M", [2, 256]]
  rnn_layers: 3
  rnn_hidden_size: 256
  feat_dim: 512
  phoc_levels: [1, 2, 3, 4]

# ----------------------------------------------------------------------
# Pretraining hyperparameters
# ----------------------------------------------------------------------
# Dataset and training parameters are now configured here so that
# ``pretraining.py`` and other scripts use the same values.
gpu_id: 0              # CUDA device index
list_file: "htr_base/data/mnt/ramdisk/max/90kDICT32px/imlist.txt"
train_set_size: 100000  # number of random training images
test_set_size: 10000   # number of random test images
batch_size: 512
num_epochs: 10000
learning_rate: 1e-3
fixed_size: [64, 256]
base_path: null        # defaults to list_file directory if null
use_augmentations: true
main_loss_weight: 1.0
aux_loss_weight: 0.1
save_path: "100k-samples"
checkpoint_every: 10
save_backbone: true
